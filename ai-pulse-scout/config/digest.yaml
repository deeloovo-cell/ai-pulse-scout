# AI Pulse Scout — Digest Configuration

digest:
  # Max items to include in each digest
  max_items: 12
  min_items: 3

  # Collection window: fetch items published within this many hours before last_successful_run
  collection_window_hours: 28

  # Safety overlap buffer added before window start (catches clock skew, delayed feeds)
  safety_buffer_hours: 2

  # Minimum relevance score to include an item (0.0–1.0)
  min_score: 0.15

scoring:
  # Keyword groups for heuristic scoring (case-insensitive)
  ai_engineering_keywords:
    - "agent"
    - "agentic"
    - "llm"
    - "large language model"
    - "transformer"
    - "foundation model"
    - "fine-tuning"
    - "rag"
    - "retrieval augmented"
    - "inference"
    - "claude"
    - "gpt"
    - "gemini"
    - "mistral"
    - "llama"
    - "prompt engineering"
    - "multimodal"
    - "reasoning model"
    - "chain of thought"

  industrial_ai_keywords:
    - "manufacturing"
    - "industrial"
    - "factory"
    - "automation"
    - "robotics"
    - "digital twin"
    - "predictive maintenance"
    - "quality control"
    - "supply chain"
    - "iiot"
    - "industry 4.0"

  cad_cae_cam_keywords:

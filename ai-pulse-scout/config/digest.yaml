# AI Pulse Scout -- Digest Configuration
# Note: production delivery currently uses generated static pages.
# Email sending is not the active production path.

digest:
  # Soft ceiling on digest items (guard against feed floods on busy days).
  # Relevance is the primary volume control: items rated 'Low' by the LLM
  # relevance gate are dropped after enrichment, so the digest normally
  # stays well below this ceiling.
  max_items: 100

  # Fetch posts published in the last 24 hours.
  collection_window_hours: 24

  # Extra overlap buffer in hours. Keep 0 when the requirement is strict last-24-hours.
  safety_buffer_hours: 0

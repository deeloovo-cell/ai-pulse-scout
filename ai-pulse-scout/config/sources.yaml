# AI Pulse Scout -- Source Registry
# Synced from config/source-inbox.md.
#
# Contract:
#   - source-inbox.md is the raw source list maintained by the user.
#   - sources.yaml is the production registry consumed by the digest pipeline.
#   - Inbox entry https://arxiv.org/ expands to canonical RSS feeds per AI-related
#     arXiv category (Computer Science + stat.ML + industrial/physical AI).
#     See https://arxiv.org/ and https://arxiv.org/category_taxonomy
#
# Topic coverage (no single arXiv label for enterprise / sim-to-real):
#   robotics          -> cs.RO
#   physical AI       -> cs.RO, cs.SY, eess.IV, cs.CV
#   CAD/CAM           -> cs.CE, cs.CG, cs.GR
#   sim-to-real       -> cs.RO, cs.SY, cs.LG, cs.CE
#   manufacturing AI  -> cs.CE
#   enterprise AI     -> cs.CY, cs.SE (partial; org/policy & software systems)

sources:

- name: arXiv cs.AI
  category: research
  url: https://arxiv.org/rss/cs.AI
  type: rss
  enabled: true
  coverage_status: live
  notes: Artificial Intelligence — from inbox https://arxiv.org/

